<app-header></app-header>
<div class="feed">
  <div class="posts">
    @if (posts$ != null) {
      @for (post of posts$ | async; track $index) {
        <div class="post">
          <div class="post-user">{{ post.author.name }}</div>
          <div class="post-content">{{ post.title }}</div>
          <div class="post-date">{{ post.content }}</div>
        </div>
      }
    }
    @else {
      <div class="loading">Carregando posts...</div>
    } 

  </div>
</div>
