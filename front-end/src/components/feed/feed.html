<div class="feed">
  <div class="feed-header">
    <h1>Feed</h1>
    <div class="user-info">
      <span class="user-name"> Nome do Usuario</span>
    </div>
  </div>
  <div class="posts">
    <div class="post" *ngFor="let post of posts$ | async">
      <div class="post-user">{{ post.authorId }}</div>
      <div class="post-content">{{ post.title }}</div>
      <div class="post-date">{{ post.content }}</div>
    </div>
  </div>
</div>
