
<header class="header">
  <div class="header-content">
    <div class="header-title" routerLink="/feed">Social .Dev</div>
    <div class="header-user">
      <span class="user-label">Usuário:</span>
      <a routerLink="profile" class="user-link" title="Ver perfil do usuário">{{ userName }}</a>
      <button class="user-link" (click)="logout()" title="Sair do sistema">
        <i class="fa fa-sign-out-alt">Sair</i>
      </button>
    </div>
  </div>
</header>
