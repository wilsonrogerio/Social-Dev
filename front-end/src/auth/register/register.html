<div class="register">
  <div class="register-presentation">
    <h1>Social .Dev</h1>
    <p>Crie sua conta e conecte as pessoas e amplie seus horizontes</p>
  </div>
  <div class="register-form">
    <form [formGroup]="formRegister" (ngSubmit)="onSubmit()">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" placeholder="Digite seu nome" required formControlName="name" />

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required formControlName="email" />

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Crie uma senha" required
        formControlName="password" />

      <button type="submit">Registrar</button>
    </form>
    <a class="login-link" routerLink="../login">Já possui conta? Faça login</a>
  </div>
</div>
