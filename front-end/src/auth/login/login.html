<div class="login">
  <div class="login-presentation">
    <h1>Social .Dev</h1>
    <p>Bem-vindo de volta! Entre na sua conta para continuar.</p>
  </div>
  <div class="login-form">
    <form [formGroup]="formLogin" (ngSubmit)="onSubmit()">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required formControlName="email" />

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Digite sua senha" required
        formControlName="password" />

      <button type="submit">Entrar</button>
    </form>
    <a class="register-link" routerLink="../register">Não possui conta? Cadastre-se</a>
  </div>
</div>
